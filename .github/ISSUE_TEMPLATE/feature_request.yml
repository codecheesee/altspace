name: "💡 Feature Request"
description: "Suggest an idea or enhancement for AltSpace"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea that would make AltSpace more powerful, faster, or easier to use? Let us know!
  - type: textarea
    id: problem
    attributes:
      label: "Problem or Friction"
      description: "Is your feature request related to a specific problem or workflow friction you encounter on Windows?"
      placeholder: "e.g. When searching for files, I often need to..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "Describe the solution you'd like to see implemented"
      placeholder: "Add a shortcut or command that allows..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative solutions or features you've looked at?"
    validations:
      required: false
