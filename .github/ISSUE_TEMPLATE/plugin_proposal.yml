name: "🔌 Extension Submission & Proposal"
description: "Submit or propose a new community extension for the AltSpace Store"
title: "[Extension]: "
labels: ["extension", "store:submission"]
body:
  - type: markdown
    attributes:
      value: |
        ### Submit a Community Extension
        Extensions run in an isolated sandbox (`%LOCALAPPDATA%\AltSpace\plugins\<id>\`) and support PowerShell (`.ps1`), Batch (`.bat`), Python (`.py`), or Node.js (`.js`).
        Every extension card includes your direct GitHub Sponsors link so users can tip you 100% directly!

  - type: input
    id: plugin_name
    attributes:
      label: "Extension Name"
      placeholder: "e.g., Spotify Mini-Controller"
    validations:
      required: true

  - type: input
    id: keyword
    attributes:
      label: "Keyword Trigger"
      description: "Omnibar keyword to invoke this extension"
      placeholder: "e.g., :spotify"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: "Script Language"
      options:
        - "PowerShell (.ps1)"
        - "Node.js (.js)"
        - "Python (.py)"
        - "Batch (.bat / .cmd)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Extension Purpose & Behavior"
      description: "What does this script do? What output does it produce?"
    validations:
      required: true

  - type: input
    id: sponsor_url
    attributes:
      label: "Your Sponsorship / Tip Link"
      description: "Direct link displayed on your extension card (GitHub Sponsors, Ko-fi, BuyMeACoffee)"
      placeholder: "https://github.com/sponsors/yourname"
    validations:
      required: false

  - type: checkboxes
    id: security_checks
    attributes:
      label: "Security & Quality Checklist"
      options:
        - label: "My extension script runs in under 15 seconds without infinite loops."
        - label: "My script does not access or modify paths outside its designated sandbox."
        - label: "I have included a clean manifest.json matching the spec in CONTRIBUTING.md."
