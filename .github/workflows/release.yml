name: Release AltSpace

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend & TypeScript Build
        working-directory: frontend
        run: npm run build

      - name: Run Unit & Security Tests
        working-directory: frontend/src-tauri
        run: cargo test --verbose

      - name: Build Release Binary
        working-directory: frontend/src-tauri
        run: cargo build --release

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist_artifacts -Force
          Copy-Item frontend/src-tauri/target/release/raycast-windows.exe dist_artifacts/altspace.exe
          Copy-Item install.ps1 dist_artifacts/install.ps1
          Compress-Archive -Path dist_artifacts/altspace.exe -DestinationPath dist_artifacts/altspace-portable-x64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_artifacts/altspace.exe
            dist_artifacts/altspace-portable-x64.zip
            dist_artifacts/install.ps1
          name: AltSpace Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
