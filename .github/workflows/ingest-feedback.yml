name: Ingest In-App User Feedback & Bug Reports

on:
  repository_dispatch:
    types: [user_feedback]
  workflow_dispatch:
    inputs:
      type:
        description: 'Feedback category (bug, feature, rating)'
        required: true
        default: 'bug'
      title:
        description: 'Feedback summary'
        required: true
      comment:
        description: 'Feedback details'
        required: true
      stars:
        description: 'Star rating (1-5)'
        required: false
        default: '5'
      contact:
        description: 'Contact / Author'
        required: false
        default: 'AltSpace User'

permissions:
  issues: write
  contents: read

jobs:
  create-issue:
    name: Create Labeled GitHub Issue from In-App Review
    runs-on: ubuntu-latest

    steps:
      - name: Process Feedback & Create Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const payload = context.payload.client_payload || context.payload.inputs || {};
            const type = (payload.type || "bug").toLowerCase();
            const stars = parseInt(payload.stars || "5", 10);
            const comment = (payload.comment || "").trim();
            const contact = payload.contact || "Anonymous AltSpace User";
            const platform = payload.platform || "Windows (AltSpace Desktop)";
            const appVersion = payload.appVersion || "2.2.0";

            let titlePrefix = "[Feedback]: ";
            const labels = ["user-feedback"];

            if (type === "bug") {
              titlePrefix = "[Bug Report]: ";
              labels.push("bug");
            } else if (type === "feature") {
              titlePrefix = "[Feature Request]: ";
              labels.push("enhancement", "community-request");
              if (stars >= 4) {
                labels.push("bounty-candidate");
              }
            } else if (type === "rating") {
              titlePrefix = `[User Review ${stars}/5]: `;
              labels.push("review");
            }

            const rawSummary = comment.split('\n')[0].slice(0, 60).trim();
            const title = `${titlePrefix}${rawSummary || `${stars}-star submission`}`;

            const body = [
              "### In-App Community Feedback Submission",
              "",
              `- **Category**: \`${type.toUpperCase()}\``,
              `- **Rating**: ${stars}/5`,
              `- **Author**: ${contact}`,
              `- **Environment**: \`${platform}\` • AltSpace v${appVersion}`,
              `- **Timestamp**: ${new Date().toISOString()}`,
              "",
              "---",
              "",
              "### Description & User Notes",
              comment || "*(No detailed comments provided)*",
              "",
              "---",
              "*Created automatically by AltSpace In-App Feedback Ingestion Pipeline.*"
            ].join("\n");

            try {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: labels
              });

              console.log(`Successfully created issue #${issue.data.number}: ${issue.data.html_url}`);
            } catch (err) {
              console.error("Failed to create issue:", err.message);
              throw err;
            }
