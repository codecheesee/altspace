name: Sync GitHub Sponsors & Entitlements

on:
  schedule:
    # Run every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-sponsors:
    name: Sync Sponsors & Contributors to Entitlements Manifest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Query GitHub Merged PRs, Sponsors & Generate Manifest
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // 1. Maintainer sovereign definition & baseline manifest
            const manifest = {
              version: 2,
              updatedAt: new Date().toISOString(),
              issuer: "https://github.com/codecheesee/altspace",
              trialPolicy: {
                limit: 100,
                windowDays: 30,
                warningThreshold: 80
              },
              maintainers: [
                {
                  login: "codecheesee",
                  id: 66432945,
                  tier: "maintainer",
                  role: "maintainer",
                  unlimited: true,
                  expiresAt: null
                }
              ],
              sponsors: [],
              contributors: [],
              pro: []
            };

            // Preserve existing manual sponsors if present in existing entitlements.json
            try {
              if (fs.existsSync('entitlements.json')) {
                const existing = JSON.parse(fs.readFileSync('entitlements.json', 'utf8'));
                if (Array.isArray(existing.sponsors)) {
                  for (const s of existing.sponsors) {
                    manifest.sponsors.push(s);
                  }
                }
                if (Array.isArray(existing.pro)) {
                  for (const p of existing.pro) {
                    manifest.pro.push(p);
                  }
                }
              }
            } catch (_) {}

            // 2. Query closed PRs to count merged PRs per contributor (Rule: >= 2 merged PRs)
            // Contributors are strictly recorded in the 'contributors' array, completely separate from paid sponsors
            try {
              const prs = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed',
                per_page: 100
              });

              const mergedCounts = {};
              for (const pr of prs.data) {
                if (pr.merged_at && pr.user && pr.user.login) {
                  const login = pr.user.login.toLowerCase();
                  if (login !== 'codecheesee' && !login.includes('[bot]')) {
                    mergedCounts[login] = (mergedCounts[login] || 0) + 1;
                  }
                }
              }

              for (const [login, count] of Object.entries(mergedCounts)) {
                if (count >= 2) {
                  manifest.contributors.push({
                    login: login,
                    tier: 'contributor',
                    role: 'contributor',
                    mergedPRCount: count,
                    expiresAt: new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toISOString()
                  });
                }
              }
            } catch (err) {
              console.log("Notice: Merged PR scan skipped:", err.message);
            }

            fs.writeFileSync('entitlements.json', JSON.stringify(manifest, null, 2));
            console.log("Generated entitlements.json with", manifest.sponsors.length, "sponsors and", manifest.contributors.length, "contributors.");

      - name: Commit & Push Updated Entitlements Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add entitlements.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(entitlements): automated sync of sponsors & contributors (>= 2 PRs) [skip ci]" && git push)
