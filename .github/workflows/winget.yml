name: Publish to Windows Package Manager (WinGet)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g. 2.1.0)'
        required: true
        default: '2.1.0'

permissions:
  contents: read

jobs:
  winget:
    name: Submit WinGet Manifest to Microsoft
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Submit to Windows Package Manager
        uses: vedantmgoyal2009/winget-releaser@v2
        continue-on-error: true
        with:
          identifier: codecheesee.altspace
          token: ${{ secrets.WINGET_TOKEN || secrets.GITHUB_TOKEN }}
