[package]
name = "raycast-windows"
version = "0.1.0"
edition = "2021"
authors = ["Narayan Gorai <66432945+codecheesee@users.noreply.github.com>"]
description = "AltSpace — High-performance desktop command palette and launcher for Windows"

[dependencies]
slint = "1.9"
fuzzy-matcher = "0.3"
serde = "1.0"
serde_json = "1.0"
once_cell = "1.19"
walkdir = "2.5"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
]

[build-dependencies]
slint-build = "1.9"
