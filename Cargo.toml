[workspace]
resolver = "2"
members = [
    "crates/altspace-win32",
    "crates/altspace-broker",
    "crates/altspace-sentinel",
    "crates/altspace-context",
    "crates/altspace-core",
    "frontend/src-tauri",
]

[workspace.package]
version = "2.3.0"
edition = "2021"
license = "Apache-2.0"
authors = ["AltSpace Core Team <maintainers@altspace.dev>"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = { version = "2.1", default-features = false }
rusqlite = { version = "0.31", features = ["bundled"] }

# Keep build speed high on SSD while preventing 30+ GB debug symbol bloat from 3rd-party crates
[profile.dev.package."*"]
opt-level = 0
debug = 0
